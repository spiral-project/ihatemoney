# This is used by Github actions to ensure docker images build properly.
version: "3.9"

services:
  ihatemoney:
    build: .
    environment:
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY to a unique random value}
  sut:
    image: alpine
    command: sh -c 'sleep 5; wget -qO- ihatemoney:8000/healthcheck | grep "OK"'
    depends_on:
      - ihatemoney
